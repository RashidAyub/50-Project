<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="6" y="4" width="36" height="40" rx="10" fill="url(#icon-grad)" filter="url(#glow)"/>
  <rect x="12" y="10" width="24" height="8" rx="4" fill="rgba(255, 255, 255, 0.25)"/>
  <!-- Keypad dots/buttons -->
  <circle cx="16" cy="24" r="2.5" fill="#ffffff"/>
  <circle cx="24" cy="24" r="2.5" fill="#ffffff"/>
  <circle cx="32" cy="24" r="2.5" fill="#ffffff"/>
  <circle cx="16" cy="31" r="2.5" fill="#ffffff"/>
  <circle cx="24" cy="31" r="2.5" fill="#ffffff"/>
  <circle cx="32" cy="31" r="2.5" fill="#ffffff"/>
  <circle cx="16" cy="38" r="2.5" fill="#ffffff"/>
  <circle cx="24" cy="38" r="2.5" fill="#ffffff"/>
  <rect x="30" y="36" width="6" height="4" rx="2" fill="#ffffff"/>
</svg>
